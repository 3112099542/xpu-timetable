# Gradle 构建属性（Spec §10：libs.versions.toml 是版本唯一事实源；此处只放构建行为开关）

# JVM 内存：本机 15GiB，与 Android Studio 并发时留足余量
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# 构建加速
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX（AGP 9 默认开启，显式声明以防被旧教程误导）
android.useAndroidX=true

# 非传递 R 类：减小生成代码体积（AGP 7+ 的标准做法）
# 非传递 R 类：本项目使用 Lucide 图标库（1666 个 drawable 资源），关闭该开关后
# 图标资源会合并进 app 的 R，界面可统一用 R.drawable.lucide_ic_* 引用（见 AppIcons 门面）。
android.nonTransitiveRClass=false
