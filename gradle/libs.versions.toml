# Gradle Version Catalog —— 全项目版本唯一事实源（Spec §4 / 架构 §10 约束 8）
# 任何模块的构建文件都不得写死版本号，一律通过版本目录引用。
# 版本值来自 2026-09-16 对官方仓库元数据的实测查询（google maven / maven central）。

[versions]
# 构建工具链
agp = "9.4.0"                    # 最新稳定版（≥9.1.2 才支持 compileSdk 37）
kotlin = "2.3.21"                # ADR-009；AGP 9 内建 Kotlin 运行期依赖 KGP ≥2.2.10
ksp = "2.3.12"                   # 供后续 Room 注解处理使用（首次构建后按报错校准）

# AndroidX / Compose
composeBom = "2026.08.00"        # Spec §4 锁定（最新为 2026.09.00，留待 v1.1 评估）
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation3 = "1.2.0-rc01"       # ADR-008；稳定版发布后替换
room3 = "3.0.3"                  # ADR-003；坐标为 androidx.room3（注意不是 androidx.room）
sqliteBundled = "2.6.2"          # Room 3 必需：提供 BundledSQLiteDriver（已移除 SupportSQLite）
glance = "1.2.0"                 # 桌面小组件（M3，2026-09-17 实测 stable）
work = "2.11.2"                 # WorkManager（M3 跨天刷新，架构 §4.1 既定版本）
datastore = "1.2.0"              # 偏好设置（随 Room 里程碑接入）

# 网络与序列化
okhttp = "5.4.0"                 # ADR-005；不引入 Retrofit
kotlinxSerialization = "1.11.0"

# Baseline Profile（M7）：把启动期热点方法预编译进 APK，改善冷启动
# 版本经 2026-09-30 对 Google Maven 元数据实测：baselineprofile 插件与 androidx.benchmark
# 属同一版本列车（同号发布），故共用同一版本值
baselineProfile = "1.5.0"
profileInstaller = "1.4.1"       # 本地应用 profile 的运行时安装器（API 31 以下必需）

# 仪器化测试（仅 :baselineprofile 模块用）
testExtJunit = "1.3.0"
uiautomator = "2.4.0"

# 图标（ADR-002：全项目唯一图标库）
lucide = "2.2.1"

# 二维码（M6 需求 6-B：纯 Java core，无传递依赖；不引 zxing-android-embedded——需 AppCompat 且带旧 core）
zxing = "3.5.4"

[libraries]
# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# 基础组件
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# 存储
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
# Room 3 必须显式提供 SQLiteDriver（已移除 SupportSQLite）；BundledSQLiteDriver 类是经构件核实的
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqliteBundled" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# 桌面小组件（M3）：Glance 不会传递带入 WorkManager，必须显式声明
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glance" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# 网络与序列化
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# 图标（ADR-002）
lucide-icons = { group = "com.composables", name = "icons-lucide-android", version.ref = "lucide" }

# 二维码（M6）：只加 core（生成 + 解图），不加相机扫码
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

# Baseline Profile（M7）：profile 安装器 + 生成器（Macrobenchmark）与仪器化测试依赖
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileInstaller" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "baselineProfile" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# 测试
junit = { group = "junit", name = "junit", version = "4.13.2" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version = "1.10.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Compose 编译器插件：Kotlin 2.0 起启用 compose 必须应用（2026-09-16 首次构建实测确认）
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# 注意：AGP 9 内建 Kotlin 支持，禁止再 apply org.jetbrains.kotlin.android（Spec §4 / AGP 9.0 发布说明）
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room3" }
# Baseline Profile（M7）：com.android.test 用于生成器模块；androidx.baselineprofile 负责
# 自动采集与合并 profile（app 与生成器模块都要应用后者，见官方 configure-baseline-profiles）
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineProfile" }
